<div [ngClass]="isMobile ? 'mobile-listing': 'desktop-listing'" class="listing">
  <div class="wrapper">
    <img [src]="estate.url" alt="">
  </div>
  <div class="content">
    <div class="title">
      <h3>{{estate.title}}</h3>
      <h5>{{estate.type}}</h5>
      <div class="stars">
        <div *ngFor="let star of starsArray(estate.stars)">★</div>
        <div *ngFor="let star of starsArray(5-starsArray(estate.stars).length)">☆</div>
      </div>
    </div>
    <div class="details">
      <p>{{estate.sqm}}m<sup>2</sup></p>
      <p>{{estate.rooms}} rooms</p>
      <p> {{estate.bathrooms}} bathrooms</p>
    </div>
    <hr>
    <div class="description">
      <p>{{estate.description}}</p>
    </div>
  </div>
</div>
